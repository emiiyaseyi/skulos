# Netlify deploy config for the SKULOS marketing site.
# The site is static (no build step); Netlify just serves the /site folder.
[build]
  publish = "site"
  command = ""

# Friendly URLs: /about instead of /about.html
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200
[[redirects]]
  from = "/pricing"
  to = "/pricing.html"
  status = 200
[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200
[[redirects]]
  from = "/faq"
  to = "/faq.html"
  status = 200
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200
[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200
